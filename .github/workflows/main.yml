# Windows RDP via Tailscale (with local user Sultan)
name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Display Runner Region (Approximate)
        shell: powershell
        run: |
          Write-Host "Fetching public IP and location..."
          try {
            $ip = (Invoke-RestMethod -Uri "https://api.ipify.org" -ErrorAction Stop).Trim()
            $geo = Invoke-RestMethod -Uri "https://ipapi.co/$ip/json/" -ErrorAction Stop
            Write-Host "##[group]Runner Location (approx.)"
            Write-Host "IP: $ip"
            Write-Host "City: $($geo.city)"
            Write-Host "Region: $($geo.region)"
            Write-Host "Country: $($geo.country_name)"
            Write-Host "Timezone: $($geo.timezone)"
            Write-Host "##[endgroup]"
          } catch {
            Write-Host "Unable to determine location. GitHub does not support region selection."
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Downloading Tailscale installer..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.76.3.exe" -OutFile "$env:TEMP\tailscale-setup.exe"
          Write-Host "Installing Tailscale silently..."
          Start-Process -FilePath "$env:TEMP\tailscale-setup.exe" -ArgumentList "/S" -Wait
          Write-Host "Tailscale installation completed."

      - name: Authenticate Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) {
            Write-Error "TAILSCALE_AUTH_KEY secret is not set."
            exit 1
          }
          Start-Sleep -Seconds 10
          & "C:\Program Files\Tailscale\tailscale.exe" up --auth-key $env:TAILSCALE_AUTH_KEY --accept-routes --accept-dns
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tailscale authentication failed."
            exit 1
          }
          Write-Host "Tailscale authenticated successfully."

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          if (-not $ip) {
            Write-Error "Failed to retrieve Tailscale IP."
            exit 1
          }
          Write-Host "##[group]Tailscale IP Address"
          Write-Host $ip
          Write-Host "##[endgroup]"
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_OUTPUT
        id: tailscale_ip

      # Try to disable password complexity – this may or may not work,
      # but we will use net user anyway which bypasses it.
      - name: Disable Password Complexity (attempt)
        shell: powershell
        run: |
          Write-Host "Attempting to disable password complexity..."
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name "PasswordComplexity" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name "MinimumPasswordLength" -Value 0 -Force
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'MinimumPasswordLength = .+', 'MinimumPasswordLength = 0' | Set-Content C:\secpol.cfg
          secedit /configure /db secedit.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY /quiet
          Write-Host "Attempt completed."

      - name: Create Local User 'Sultan' using net user
        shell: powershell
        run: |
          $username = "Sultan"
          $password = "WL3DEKABOHA"
          # Check if user already exists
          $exists = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($exists) {
            Write-Host "User $username already exists. Updating password..."
            net user $username $password
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to update password for $username."
              exit 1
            }
          } else {
            Write-Host "Creating user $username with net user..."
            net user $username $password /add /fullname:"Sultan" /comment:"RDP user"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create user $username."
              exit 1
            }
            # Set account to never expire
            net accounts /maxpwage:unlimited
            wmic useraccount where "name='$username'" set PasswordExpires=false
          }
          # Add to Remote Desktop Users
          net localgroup "Remote Desktop Users" $username /add
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Failed to add $username to Remote Desktop Users group (may already be added)."
          }
          Write-Host "User $username created/updated successfully."

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService
          New-NetFirewallRule -DisplayName "Remote Desktop (TCP-In)" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow
          Write-Host "Remote Desktop enabled."

      - name: Display Connection Information
        shell: powershell
        run: |
          Write-Host "##[group]RDP Connection Details"
          Write-Host "Tailscale IP: ${{ steps.tailscale_ip.outputs.TAILSCALE_IP }}"
          Write-Host "RDP Port: 3389"
          Write-Host "Username: Sultan"
          Write-Host "Password: WL3DEKABOHA"
          Write-Host "Connection Status: READY"
          Write-Host "Connect using: mstsc.exe /v:${{ steps.tailscale_ip.outputs.TAILSCALE_IP }}:3389"
          Write-Host "##[endgroup]"

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Keeping runner active. This step will run until the job is cancelled or timeout."
          $ip = "${{ steps.tailscale_ip.outputs.TAILSCALE_IP }}"
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner is alive."
            Write-Host "  Tailscale IP: $ip"
            Write-Host "  RDP: Sultan / (password set in workflow)"
            Write-Host "  Use: mstsc /v:$ip:3389"
            Start-Sleep -Seconds 300
          }
